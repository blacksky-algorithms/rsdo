type: object

properties:
  name:
    type: string
    example: app-01
    description: The name of a database user.

  role:
    type: string
    enum:
      - primary
      - normal
    example: normal
    description: |
      A string representing the database user's role. The value will be either
      "primary" or "normal".
    readOnly: true

  password:
    type: string
    example: jge5lfxtzhx42iff
